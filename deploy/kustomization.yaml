# ArgoCD(oh-my-homelab 의 helm-charts/apps/my-lost-city.yaml)가 이 디렉터리를 kustomize 로 렌더한다.
# 시크릿 없음 (방 암호는 런타임 메모리 데이터).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: my-lost-city
resources:
- namespace.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
labels:
- pairs:
    app.kubernetes.io/part-of: my-lost-city
images:
- name: ghcr.io/shinkeonkim/my-lost-city
  newName: ghcr.io/shinkeonkim/my-lost-city
  newTag: sha-147e8b9
